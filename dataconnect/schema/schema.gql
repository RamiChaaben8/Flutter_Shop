# The Product table. The 'id' will be your code bar.
type Product @table {
  id: String!
  name: String!
  price: Float!
}

# The Fruit/Vegetable table (scanned by AI camera, sold by weight)
type Fruit @table {
  id: String!
  name: String!
  pricePerKg: Float!
}

# The Facture (Invoice) table — userId links it to the authenticated user
type Facture @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String
  totalPrice: Float!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Regular product items inside a Facture (quantity-based, no nulls)
type FactureItem @table {
  id: UUID! @default(expr: "uuidV4()")
  facture: Facture!
  product: Product!
  quantity: Float!
}

# Fruit/veg items inside a Facture (weight-based, no nulls)
type FactureFruitItem @table {
  id: UUID! @default(expr: "uuidV4()")
  facture: Facture!
  fruit: Fruit!
  weight: Float!
}