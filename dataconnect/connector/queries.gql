# Query to list all products
query ListProducts @auth(level: USER) {
  products {
    id
    name
    price
  }
}

# Query to get a specific product by its code bar (id)
query GetProductById($id: String!) @auth(level: USER) {
  product(id: $id) {
    id
    name
    price
  }
}

# Query to list all factures
query ListFactures @auth(level: USER) {
  factures(orderBy: [{ createdAt: DESC }]) {
    id
    totalPrice
    createdAt
  }
}

# Query to get items of a facture
query GetFactureItems($factureId: UUID!) @auth(level: USER) {
  factureItems(where: { factureId: { eq: $factureId } }) {
    id
    quantity
    product {
      id
      name
      price
    }
  }
}